name: SmartKey
options:
  bundleIdPrefix: io.github.tdhieu94
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_IDENTITY: "-"   # ad-hoc: SmartKey has no Apple Developer ID yet
    SWIFT_VERSION: "5.10"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  SmartKey:
    type: application
    platform: macOS
    dependencies:
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework
      - package: Sparkle
    sources:
      - path: App
      - path: Engine
        excludes:
          - "platforms/win32.h"
          - "platforms/linux.h"
    settings:
      base:
        PRODUCT_NAME: SmartKey
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tdhieu94.smartkey
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Vikey.entitlements
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: App/Core/Vikey-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Engine", "$(SRCROOT)/Engine/platforms"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
